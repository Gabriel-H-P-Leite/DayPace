<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>DAYPACE - Registro</title>
		{% load static %}
		<link rel="stylesheet" href="{% static 'css/style.css' %}">
		{% load static %}
		<link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
	</head>
	<body>
		{% if messages %}
			{% for message in messages %}
				<div class="caixa frente">
					<div class='fechar'>X</div>
					<div class='campos'>{{ message }}</div>
				</div>
			{% endfor %}
		{% endif %}
		{% load static %}
		<script src="{% static 'js/script.js' %}"></script>
		<div class='centro'>
			<div class='caixa'>
				<h1 class='titulo'>Registrar</h1>
			<form method="POST">
				{% csrf_token %}
				<div class='campos'>Nome de usuário:</div>
				<input class='caixaTexto' type="text" name="nomeUsuario" placeholder="Digite seu nome de usuário">
				<div class='campos'>Nome:</div>
				<input class='caixaTexto' type="text" name="nome" placeholder="Digite seu nome">
				<div class='campos'>Sobrenome:</div>
				<input class='caixaTexto' type="text" name="sobrenome" placeholder="Digite seu sobrenome">
				<div class='campos'>Email:</div>
				<input class='caixaTexto' type="email" name="email" placeholder="Digite seu Email">
				<div class='campos'>Senha:</div>
				<input class='caixaTexto' type="password" name="senha" placeholder="Digite sua senha">
				<div class='painel'>
					<button class='botao' type="submit">
						Registrar
					</button>
					<a href="{% url 'home' %}">
						<div class='botao'>Voltar</div>
					</a>
				</div>
			</form>
			</div>
		</div>
	</body>
</html>
