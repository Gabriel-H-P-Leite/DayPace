<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>DAYPACE - Editar usuário</title>
		{% load static %}
		<link rel="stylesheet" href="{% static 'css/style.css' %}">
		{% load static %}
		<link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
	</head>
	<body>
		{% for field in form %}
			{% for error in field.errors %}
				<div class="caixa" id="aviso">
				{{ error }}
				</div>
			{% endfor %}
		{% endfor %}
		{% load static %}
		<script src="{% static 'js/script.js' %}"></script>
		<div class='centro'>
			<div class='caixa'>
			{% load static %}
			<h1 class='titulo'>Editar usuário</h1>
			<form method="POST">
				<div class='painel'>
				{% csrf_token %}
				{{ form.first_name }}
				{{ form.last_name }} 
				{{ form.email }}
				<button class="botao" type="submit">Salvar</button>
					<a href="{% url 'home' %}">
						<div class='botao'>Voltar</div>
					</a>
				</div>
			</form>
			</div>
		</div>
	</body>
</html>
