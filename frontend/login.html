<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>DAYPACE - Login</title>
		{% load static %}
		<link rel="stylesheet" href="{% static 'style.css' %}">
		{% load static %}
		<link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
	</head>
	<body>
		{% if messages %}
			{% for message in messages %}
				<div class="caixa frente">
					<div class='fechar'>X</div>
					{{ message }}
				</div>
			{% endfor %}
		{% endif %}
		{% load static %}
		<script src="{% static 'script.js' %}"></script>
		<div class='centro'>
			<div class='caixa'>
			{% load static %}
			<img src="{% static 'logo.png' %}" alt="logo" class='logo'> 
			<form method="POST">
				{% csrf_token %}
				<input class='caixaTexto' type="text" name="nomeUsuario" placeholder="Nome de usuário">
				<input class='caixaTexto' type="password" name="senha" placeholder="Senha">
				<div class='painel'>
					<button class='botao' type="submit">
						Entrar
					</button>
					<a href="{% url 'home' %}">
						<div class='botao'>Voltar</div>
					</a>
				</div>
			</form>
			</div>
		</div>
	</body>
</html>
